name: CI

# The same install and build Cloudflare Pages runs, on every push and pull
# request, so a broken build or a failed type or content check shows up
# here before a deployment does.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .node-version
      # corepack installs the pnpm version packageManager names.
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check and build
        run: pnpm run build
